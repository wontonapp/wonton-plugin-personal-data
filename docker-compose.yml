# 手机数据：手机的位置和健康数据存储。给家里的助手查、删、导出。
services:
  store:
    # 自建镜像，发布时由 scripts/publish.sh 换成清单摘要（多架构）。
    image: ghcr.io/wontonapp/wonton-plugin-personal-data/store:0.1.0
    # 以主人的 uid:gid 运行，${WONTON_APP_DATA} 的属主就是它。
    user: "${PUID}:${PGID}"
    environment:
      DATA_DIR: /data
      # 根文件系统只读，SQLite 的临时文件放内存盘。
      SQLITE_TMPDIR: /tmp
    volumes:
      # SQLite 数据库跟着插件的数据目录走：重装、升级都在，卸载加 purge 才删。
      - "${WONTON_APP_DATA}:/data"
    read_only: true
    tmpfs:
      - /tmp
    # 一个进程加 SQLite，线程不多；内存上限拦住异常增长。
    pids_limit: 64
    mem_limit: 96M
    healthcheck:
      # 查得动数据库才算可用，不只是进程活着。
      test: ["CMD", "/app/personal-data", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

x-wonton:
  spec: "0.13"
  id: app.wonton.personal-data
  version: 0.1.0
  kind: app
  title: { zh: 手机数据, zh-Hant: 手機資料, ja: スマホのデータ, en: Phone Data }
  description:
    zh: 把手机上的位置和健康数据存在家里，让家里的助手能回答“我现在在哪”“这周睡得怎么样”。打开哪一项、哪个助手能看都由你决定。
    zh-Hant: 把手機上的位置和健康資料存在家裡，讓家裡的助手能回答「我現在在哪」「這週睡得怎麼樣」。打開哪一項、哪個助手能看都由你決定。
    ja: スマホの位置情報と健康データを家の中に保存し、家のアシスタントが「今どこにいる」「今週の睡眠はどうだった」に答えられるようにします。どの種類をオンにして、どのアシスタントに読ませるかはあなたが決めます。
    en: Keeps your phone's location and health data at home so your household assistant can answer "where am I" or "how did I sleep this week". You decide which types are on and which assistants may read them.
  icon: icon.svg
  notices: [NOTICE]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/wontonapp/wonton-plugin-personal-data
  # 应用是本仓库的 Rust 服务，许可证 MIT；插件包自己的许可证也写在 LICENSE。
  license: MIT
  tags:
    zh: [智能家居, 健康]
    zh-Hant: [智慧家庭, 健康]
    ja: [スマートホーム, 健康]
    en: [Home, Health]
  about:
    zh: |
      手机上的位置和环境助手不在一处：这个插件把手机同步来的位置点、步数、睡眠这些健康样本存在你自己的服务器上，助手要查历史、算“今天走了几步”时读这里。

      数据按人分开存。谁的位置、哪个类型打开、哪些助手能读，都在 App 的“设置 → 手机数据”里定，默认全关。

      保存期限按类型设，位置默认 30 天、健康默认 1 年，到期由这个插件删；也能导出成一份 JSON 带走。

      位置点按 OwnTracks 的写法存，以后想同时记到 Dawarich 这类应用里也不用换格式。
    en: |
      Your phone's location and your assistant are not in the same place: this plugin keeps the location points and health samples (steps, sleep and the rest) that your phone syncs on your own server, and assistants read from here when they need history or "how many steps today".

      Data is kept per person. Whose data, which types are on and which assistants may read them are all decided in the app under Settings → Phone data, off by default.

      Retention is set per type, 30 days for location and a year for health by default, and this plugin deletes expired data. You can also export everything as one JSON file.

      Location points are stored in the OwnTracks writing, so recording to apps like Dawarich later needs no format change.
  release_notes:
    zh: "第一版：存位置和健康样本，查询、删除、导出、按期限清理。"
    zh-Hant: "第一版：存位置和健康樣本，查詢、刪除、匯出、按期限清理。"
    ja: "最初の版：位置情報と健康サンプルの保存、検索、削除、エクスポート、保存期限による整理。"
    en: "First version: stores location points and health samples, query, delete, export and retention cleanup."
  permissions: []
  # 契约的路径和类型在核心仓库的 wonton-protocol；凭据按使用方签发，核心给每个使用方一把。
  provides:
    personal_data:
      service: store
      port: 8090
      credentials:
        issue: ["/app/personal-data", "credentials", "issue", "{name}"]
        revoke: ["/app/personal-data", "credentials", "revoke", "{name}"]
  # musl 静态二进制，两种架构都有；SQLite 常驻内存很小。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
